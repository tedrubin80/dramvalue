{# SEO meta tags — include from {% block extra_head %} in page templates #}
{% macro tags(title, description=none, robots="index, follow", path="/", og_type="website") %}
{% set desc = description or default_meta_description %}
{% set canonical = site_url ~ path %}
<meta name="description" content="{{ desc }}">
<meta name="robots" content="{{ robots }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ desc }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:type" content="{{ og_type }}">
<meta property="og:locale" content="en_US">
<meta property="og:image" content="{{ site_url }}/og-image.png">
<meta property="og:image:width" content="1536">
<meta property="og:image:height" content="1024">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ site_url }}/og-image.png">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ desc }}">
{% endmacro %}
